services:
  db:
    image: mysql:8.0
    container_name: coffee_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-coffee_reserve_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_USER: ${MYSQL_USER:-coffee_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coffeepassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coffee_django_backend
    restart: always
    # migrate + seed, not makemigrations: a container boot should apply the committed
    # migrations, never invent new ones (which then vanish with the container).
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - MYSQL_DATABASE=${MYSQL_DATABASE:-coffee_reserve_db}
      - MYSQL_USER=${MYSQL_USER:-coffee_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-coffeepassword}
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - CHAPA_SECRET_KEY=${CHAPA_SECRET_KEY:-CHASECK_TEST-samplekey}
      - CHAPA_WEBHOOK_SECRET=${CHAPA_WEBHOOK_SECRET:-chapa_webhook_secret_sample}
      # Chapa's server-to-server callback must point at a host it can reach, so this
      # has to be the public address of the API, not "localhost" inside the container.
      - BACKEND_PUBLIC_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      # Seed users carry @gmail.com addresses; a real DNS lookup would make the
      # container boot depend on the network being up.
      - REQUIRE_EMAIL_MX=${REQUIRE_EMAIL_MX:-false}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coffee_next_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # next.config.js proxies /api/v1 and /media through INTERNAL_BACKEND_URL. It used
      # to read NEXT_PUBLIC_API_URL, which nothing in the code consulted, so inside the
      # container the app resolved "localhost:8000" - itself - and every API call 404'd.
      - INTERNAL_BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  mysql_data:
  media_data:
