name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    name: Backend (Django tests)
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: 'ci-only-not-a-secret-4f2c9a1b7e6d5c8a0f3b1e9d7c5a2b8e4f6d0c1a3b5e7f9d'
      ORDER_PAYMENT_WINDOW_MINUTES: '30'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        env:
          USE_SQLITE: 'true'
          REQUIRE_EMAIL_MX: 'false'
          DEBUG: 'false'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
          GEMINI_API_KEY: ''
        run: python manage.py check --deploy --fail-level ERROR

      - name: Verify migrations are committed
        env:
          USE_SQLITE: 'true'
          REQUIRE_EMAIL_MX: 'false'
          DEBUG: 'false'
          ALLOWED_HOSTS: 'localhost,testserver'
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        env:
          USE_SQLITE: 'true'
          REQUIRE_EMAIL_MX: 'false'
          DEBUG: 'false'
          ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
          ASSISTANT_USE_LLM: 'false'
          GEMINI_API_KEY: ''
        run: python manage.py test apps api --verbosity 2

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        env:
          INTERNAL_BACKEND_URL: 'http://backend:8000'
        run: npm run build

  docker:
    name: Docker Compose config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Compose file parses and resolves
        run: docker compose config --quiet